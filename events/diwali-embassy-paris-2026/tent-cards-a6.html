<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vedas — Diwali Embassy Paris Tent Cards (Folded A6)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap');
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: "Cormorant Garamond", Georgia, serif; }

  .page {
    width: 210mm; height: 297mm;
    display: grid;
    grid-template-columns: 105mm 105mm;
    grid-template-rows: 148.5mm 148.5mm;
    page-break-after: always;
    position: relative;
  }
  .page:last-child { page-break-after: auto; }

  /* cut guides: fine, widely-spaced SVG dots so the line disappears once cut */
  .cutlines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* One A6 = one tent. Folds in half across the middle -> two A7 faces. */
  .card {
    width: 105mm; height: 148.5mm;
    position: relative;
    background: #fff;
    overflow: hidden;
  }

  /* Each half = one landscape face (105 x 74.25 mm), wedding floral style */
  .half {
    height: 50%; position: relative; overflow: hidden;
    padding: 6mm 12mm;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .half.top { transform: rotate(180deg); }   /* so it reads upright from the back of the tent */
  /* top edge of each face is the fold; flowers bleed into it */

  .fl { position: absolute; pointer-events: none; }
  .fl.tl { top: 0; left: 0; width: 43mm; }
  .fl.br { bottom: 0; right: 0; width: 27mm; transform: rotate(180deg); }

  .name { font-size: 15pt; font-weight: 600; color: #7a6233; line-height: 1.12;
          text-transform: uppercase; letter-spacing: 0.12em; margin: 0; }
  .rule { width: 9mm; border-top: 0.3mm solid #2e2e2e; margin: 3.2mm 0 3mm; }
  .desc { font-size: 11.5pt; font-weight: 500; color: #3f3f3f; line-height: 1.3; margin: 0;
          max-width: 76mm; }
  .veg { display: flex; align-items: center; justify-content: center; gap: 1.8mm; margin-top: 3.4mm; }
  .sym { width: 3.2mm; height: 3.2mm; display: block; }
  .symlabel { font-size: 7pt; text-transform: uppercase; letter-spacing: 0.22em; color: #4f4f4f; margin: 0; }

  @media screen {
    body { background:#e9e3d8; padding: 10px; }
    .page { background:#fff; margin: 0 auto 16px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const ITEMS = [
  /* ---- Snacks ---- */
  { n:"Aloo Tikki", t:"veg",
    d:"Golden potato patties spiced with cumin, ginger & fresh coriander" },
  { n:"Paneer Shashlik", t:"veg",
    d:"Paneer, peppers & onion marinated in spices, grilled in the tandoor" },

  /* ---- Mithai (sweets) ---- */
  { n:"Motichoor Ladoo", t:"veg",
    d:"Festive sweet of tiny gram-flour pearls with ghee & cardamom" },
  { n:"Gulab Jamun", t:"veg",
    d:"Milk dumplings soaked in rose & cardamom syrup" },
  { n:"Kesar Elaichi Peda", t:"veg",
    d:"Soft milk fudge flavoured with saffron & cardamom" },
];

const root = document.getElementById('root');

function card(it) {
  return `<div class="card">
    <div class="half top">${face(it)}</div>
    <div class="half">${face(it)}</div>
  </div>`;
}
function symSVG(t) {
  const c = t === 'veg' ? '#1d5c3a' : '#9e1414';
  const inner = t === 'veg'
    ? `<circle cx="10" cy="10" r="4.6" fill="${c}"/>`
    : `<polygon points="10,4.6 15.4,14.6 4.6,14.6" fill="${c}"/>`;
  return `<svg class="sym" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">`
    + `<rect x="1.4" y="1.4" width="17.2" height="17.2" fill="none" stroke="${c}" stroke-width="1.8"/>`
    + inner + `</svg>`;
}
function face(it) {
  const label = it.t === 'veg' ? 'Vegetarian' : 'Non-Vegetarian';
  return `<img class="fl tl" src="flowers-corner.png" alt="">
    <img class="fl br" src="flowers-corner.png" alt="">
    <h2 class="name">${it.n}</h2>
    <div class="rule"></div>
    <p class="desc">${it.d}</p>
    <div class="veg">${symSVG(it.t)}<p class="symlabel">${label}</p></div>`;
}

const CUTLINES = `<svg class="cutlines" viewBox="0 0 210 297" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`
  + `<g fill="none" stroke="#c7b596" stroke-width="0.18" stroke-dasharray="0.18 4.5" stroke-linecap="round">`
  + `<line x1="105" y1="0" x2="105" y2="297"/>`
  + `<line x1="0" y1="148.5" x2="210" y2="148.5"/>`
  + `</g></svg>`;

for (let i = 0; i < ITEMS.length; i += 4) {
  const page = document.createElement('div');
  page.className = 'page';
  page.innerHTML = ITEMS.slice(i, i + 4).map(card).join('') + CUTLINES;
  root.appendChild(page);
}
</script>
</body>
</html>
