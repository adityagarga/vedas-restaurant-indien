<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vedas — Welcome Party Menu (A4 reference card)</title>
<!--
  Welcome Party menu as an A4 portrait reference card. Content lives in menu-data.js; design in ../shared/. Export:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --no-pdf-header-footer \
    --virtual-time-budget=15000 --print-to-pdf=Vedas-Welcome-Party-Menu-A4.pdf menu-card-a4.html
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="../shared/menu.css">
<style>
  @page { size: A4 portrait; margin: 0; }
  .sheet { width: 210mm; height: 297mm; --m: 1.1; --gap: 14mm; }
  .face { width: 210mm; height: 297mm; }
  .content { padding: 32mm 24mm 30mm; }   /* footer sits above the bottom-right flowers */
  .corner.tl { top: -3mm; left: -3mm; width: 92mm; }
  .corner.br { bottom: -3mm; right: -3mm; width: 56mm; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script src="menu-data.js"></script>
<script src="../shared/menu-render.js"></script>
<script>
document.getElementById("sheet").innerHTML = menuFace({ eyebrow: "Welcome Party", sections: WP_SECTIONS, layout: [
  ["Live Cooking Stations", "Chaat & Vegetarian Kebabs", "Tandoori"],
  ["Accompaniments", "Desserts", "Drinks", "Bar"],
]});
</script>
</body>
</html>
