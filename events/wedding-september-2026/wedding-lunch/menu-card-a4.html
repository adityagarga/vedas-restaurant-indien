<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vedas — Wedding Lunch Menu (A4 reference card)</title>
<!--
  Wedding lunch menu as an A4 portrait reference card. Content lives in lunch-menu-data.js; design in ../shared/. Export:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --no-pdf-header-footer \
    --virtual-time-budget=15000 --print-to-pdf=Vedas-Wedding-Lunch-Menu-A4.pdf menu-card-a4.html
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="../shared/menu.css">
<style>
  @page { size: A4 portrait; margin: 0; }
  .sheet { width: 210mm; height: 297mm; --m: 1.5; --gap: 14mm; }
  .face { width: 210mm; height: 297mm; }
  .content { padding: 34mm 22mm 30mm; }   /* footer sits above the bottom-right flowers */
  .corner.tl { top: -3mm; left: -3mm; width: 92mm; }
  .corner.br { bottom: -3mm; right: -3mm; width: 56mm; }
  /* the menu text is scaled up on this short menu; keep the small print at its usual size */
  .meta { font-size: 8pt; letter-spacing: 2.4px; }
  .footer { font-size: 8pt; letter-spacing: 2.2px; }

  /* dish names styled like the item tents: gold capitals; headings as small grey caps over the tents' thin dark rule */
  .sec h3 { color: #4d4d4d; font-weight: 500; font-size: calc(7.2pt * var(--m)); letter-spacing: calc(3px * var(--m)); margin: 0; }
  .sec h3::after { content: ""; display: block; width: calc(9mm * var(--m)); border-top: .25mm solid #4a4a4a;
                   margin: calc(2mm * var(--m)) auto calc(2.6mm * var(--m)); }
  .sec + .sec { margin-top: calc(6mm * var(--m)); }
  .sec li { text-transform: uppercase; font-weight: 600; color: #6b5a1e; font-size: calc(9.4pt * var(--m));
            letter-spacing: calc(1.5px * var(--m)); line-height: 1.3; margin: 0 0 calc(1.9mm * var(--m)); }
  .sec li .sub { text-transform: none; letter-spacing: 0; font-weight: 400; font-style: normal; color: #444;
                 font-size: calc(8.4pt * var(--m)); margin: calc(.6mm * var(--m)) 0 0; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script src="lunch-menu-data.js"></script>
<script src="../shared/menu-render.js"></script>
<script>
document.getElementById("sheet").innerHTML = menuFace({ eyebrow: "Wedding Lunch", sections: LUNCH_SECTIONS, layout: [
  ["Starters", "Mains"],
  ["Accompaniments", "Dessert", "Drinks"],
]});
</script>
</body>
</html>
