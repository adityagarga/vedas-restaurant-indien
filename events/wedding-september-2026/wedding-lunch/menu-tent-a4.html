<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vedas — Wedding Lunch Menu Tent (A4 folded)</title>
<!--
  Full menu as a table tent: one A4 sheet folded across the middle, so each side is a
  210 x 148.5mm (A5 landscape) face and the menu reads from both sides of the table.
  Content lives in lunch-menu-data.js; design in ../shared/. Export:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --no-pdf-header-footer \
    --virtual-time-budget=15000 --print-to-pdf=Vedas-Wedding-Menu-Tent-A4.pdf menu-tent-a4.html
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="../shared/menu.css">
<style>
  @page { size: A4 portrait; margin: 0; }
  .sheet { width: 210mm; height: 297mm; position: relative; --m: 1.04; --gap: 8mm; }
  .face { width: 210mm; height: 148.5mm; }
  .content { padding: 13mm 24mm 10mm; }
  .corner.tl { top: -2mm; left: -2mm; width: 72mm; }
  .corner.br { bottom: -2mm; right: -2mm; width: 44mm; }   /* small enough to clear the footer */

  /* fold marks at the edges only */
  .fold { position: absolute; left: 0; right: 0; top: 148.5mm; height: 0; pointer-events: none; }
  .fold::before, .fold::after { content: ""; position: absolute; top: 0; width: 4mm; border-top: .2mm solid #d6cdb8; }
  .fold::before { left: 0; } .fold::after { right: 0; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script src="lunch-menu-data.js"></script>
<script src="../shared/menu-render.js"></script>
<script>
const MENU = { eyebrow: "Wedding Lunch", sections: LUNCH_SECTIONS, layout: [
  ["Starters", "Mains"],
  ["Accompaniments"],
  ["Dessert", "Drinks"],
]};
document.getElementById("sheet").innerHTML =
  menuFace({ ...MENU, cls: "top" }) + menuFace(MENU) + `<div class="fold"></div>`;
</script>
</body>
</html>
